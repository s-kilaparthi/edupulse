<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduPulse OMR Answer Sheet — 50 Questions</title>
  <style>
    @page { size: 210mm 297mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 210mm; height: 297mm; margin: 0; padding: 0;
      background: #fff; color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }
    .sheet {
      position: relative; width: 210mm; height: 297mm;
      background: #fff; overflow: hidden; page-break-after: avoid;
    }
    .corner-marker {
      position: absolute; width: 18mm; height: 18mm; background: #000;
    }
    .corner-tl { top: 10mm; left: 10mm; }
    .corner-tr { top: 10mm; right: 10mm; }
    .corner-bl { bottom: 10mm; left: 10mm; }
    .corner-br { bottom: 10mm; right: 10mm; }
    .content {
      position: absolute; top: 30mm; left: 28mm; right: 28mm; bottom: 43mm;
      display: flex; flex-direction: column;
    }
    .header {
      height: 35mm; flex-shrink: 0;
      display: flex; flex-direction: column; justify-content: center; width: 100%;
    }
    .header h1 {
      font-size: 16pt; font-weight: bold; letter-spacing: 0.5mm;
      margin-bottom: 3mm; text-align: center;
    }
    .header-fields {
      display: flex; flex-direction: column; gap: 2mm;
      font-size: 10pt; text-align: left; width: 100%;
    }
    .header-fields .field {
      border-bottom: 0.3mm solid #000; padding-bottom: 0.5mm; line-height: 1.3;
    }
    .questions-grid { display: flex; gap: 10mm; flex-shrink: 0; height: 175mm; }
    .questions-column { flex: 1; display: flex; flex-direction: column; }
    .question-row {
      display: flex; align-items: center;
      height: 7mm; min-height: 7mm; max-height: 7mm;
    }
    .q-num { width: 10mm; font-size: 7pt; font-weight: bold; flex-shrink: 0; }
    .bubbles { display: flex; align-items: center; gap: 2mm; }
    .bubble-cell {
      width: 7mm; height: 7mm;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .bubble {
      width: 7mm; height: 7mm; border: 0.3mm solid #000; border-radius: 50%;
      background: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 7px; color: #999; line-height: 1;
    }
    @media print {
      html, body, .sheet { width: 210mm; height: 297mm; }
      .corner-marker {
        background: #000 !important;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
    }
    @media screen { body { margin: 10mm auto; } }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="corner-marker corner-tl" aria-hidden="true"></div>
    <div class="corner-marker corner-tr" aria-hidden="true"></div>
    <div class="corner-marker corner-bl" aria-hidden="true"></div>
    <div class="corner-marker corner-br" aria-hidden="true"></div>
    <div class="content">
      <header class="header">
        <h1>EduPulse</h1>
        <div class="header-fields">
          <div class="field">Roll No: _________________________</div>
          <div class="field">Exam: ____________________________</div>
          <div class="field">Date: ____________________________</div>
        </div>
      </header>
      <div class="questions-grid">
        <div class="questions-column" id="col-left"></div>
        <div class="questions-column" id="col-right"></div>
      </div>
    </div>
  </div>
  <script>
    function createQuestionRow(num) {
      const row = document.createElement('div')
      row.className = 'question-row'
      const qNum = document.createElement('span')
      qNum.className = 'q-num'
      qNum.textContent = 'Q' + num
      const bubbles = document.createElement('div')
      bubbles.className = 'bubbles'
      ;['A', 'B', 'C', 'D'].forEach((label) => {
        const cell = document.createElement('div')
        cell.className = 'bubble-cell'
        const bubble = document.createElement('div')
        bubble.className = 'bubble'
        bubble.textContent = label
        bubble.setAttribute('aria-label', 'Q' + num + ' ' + label)
        cell.appendChild(bubble)
        bubbles.appendChild(cell)
      })
      row.appendChild(qNum)
      row.appendChild(bubbles)
      return row
    }
    const colLeft = document.getElementById('col-left')
    const colRight = document.getElementById('col-right')
    for (let i = 1; i <= 25; i++) colLeft.appendChild(createQuestionRow(i))
    for (let i = 26; i <= 50; i++) colRight.appendChild(createQuestionRow(i))
  </script>
</body>
</html>
